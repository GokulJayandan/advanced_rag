[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-agentic-rag"
version = "1.0.0"
description = "Production-Grade Advanced Agentic RAG Platform with Hybrid Retrieval, RRF, Neural Reranking, Grounded Citations, and Adaptive Decision Loops"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AI/ML Systems Engineering" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.38.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "FlagEmbedding>=1.2.0",
    "google-genai>=1.0.0",
    "groq>=0.11.0",
    "unstructured[pdf,docx,md]>=0.16.0",
    "tiktoken>=0.7.0",
    "xxhash>=3.4.0",
    "structlog>=24.0.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]
